<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>McFetridge and Co.</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy: #1a2755;
      --navy-deep: #141e42;
      --navy-mid: #243068;
      --charcoal: #2a2a2a;
      --cream: #f4f0e8;
      --cream-mid: #ede8dc;
      --cream-dark: #e0d9cc;
      --gold: #b8935a;
      --gold-light: #d4aa72;
      --gold-pale: #e8d5b0;
      --text-mid: #4a4a4a;
      --text-light: #7a7a7a;
      --border-navy: rgba(26,39,85,0.12);
    }

    html { scroll-behavior: smooth; }

    body {
      background-color: var(--cream);
      min-height: 100vh;
      font-family: 'Jost', sans-serif;
      color: var(--charcoal);
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    .top-bar {
      height: 4px;
      background: linear-gradient(90deg, var(--navy-deep), var(--navy) 30%, var(--gold) 50%, var(--navy) 70%, var(--navy-deep));
      position: relative;
      z-index: 10;
    }

    /* LANGUAGE BAR */
    .lang-bar {
      background: var(--navy-deep);
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 8px 32px;
      gap: 4px;
      position: relative;
      z-index: 10;
    }

    .lang-label {
      font-family: 'Jost', sans-serif;
      font-size: 0.58rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(244,240,232,0.35);
      margin-right: 10px;
    }

    .lang-btn {
      background: none;
      border: 1px solid transparent;
      padding: 4px 10px;
      font-family: 'Jost', sans-serif;
      font-size: 0.62rem;
      font-weight: 400;
      letter-spacing: 0.1em;
      color: rgba(244,240,232,0.45);
      cursor: pointer;
      transition: color 0.25s, border-color 0.25s;
      border-radius: 2px;
    }

    .lang-btn:hover { color: var(--gold-light); }
    .lang-btn.active { color: var(--gold-light); border-color: rgba(212,170,114,0.35); }

    /* HEADER */
    header {
      background: var(--navy);
      padding: 52px 40px 0;
      text-align: center;
      position: relative;
      z-index: 5;
      background-image:
        linear-gradient(135deg, rgba(255,255,255,0.025) 25%, transparent 25%),
        linear-gradient(225deg, rgba(255,255,255,0.025) 25%, transparent 25%);
      background-size: 40px 40px;
    }

    .logo-wrap {
      animation: fadeDown 1s ease forwards;
      opacity: 0;
      margin-bottom: 40px;
    }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    header img {
      width: 300px;
      max-width: 72vw;
      filter: drop-shadow(0 2px 12px rgba(0,0,0,0.25));
    }

    .header-rule {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 36px;
      animation: fadeDown 1s 0.15s ease forwards;
      opacity: 0;
    }

    .rule-line { width: 72px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold-light)); }
    .rule-line.right { background: linear-gradient(90deg, var(--gold-light), transparent); }
    .rule-diamond { width: 6px; height: 6px; background: var(--gold-light); transform: rotate(45deg); }

    nav {
      display: flex;
      justify-content: center;
      border-top: 1px solid rgba(255,255,255,0.08);
      animation: fadeUp 0.9s 0.25s ease forwards;
      opacity: 0;
      position: relative;
      flex-wrap: wrap;
    }

    nav::after {
      content: '';
      position: absolute;
      bottom: -32px; left: 0; right: 0;
      height: 32px;
      background: linear-gradient(to bottom, var(--navy), var(--cream));
      z-index: 1;
      pointer-events: none;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    nav button {
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      padding: 16px 28px;
      font-family: 'Jost', sans-serif;
      font-size: 0.66rem;
      font-weight: 400;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: rgba(244,240,232,0.55);
      cursor: pointer;
      transition: color 0.3s, border-color 0.3s;
    }

    nav button:hover { color: var(--cream); }
    nav button.active { color: var(--gold-light); border-bottom-color: var(--gold-light); }

    /* MAIN */
    main {
      max-width: 860px;
      margin: 0 auto;
      padding: 96px 40px 120px;
      position: relative;
      z-index: 5;
    }

    .tab-panel { display: none; animation: panelIn 0.55s ease forwards; }
    .tab-panel.active { display: block; }

    @keyframes panelIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* TYPOGRAPHY */
    .eyebrow {
      font-family: 'Jost', sans-serif;
      font-size: 0.62rem;
      font-weight: 400;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 16px;
      display: block;
    }

    h2 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.1rem, 5vw, 3rem);
      font-weight: 400;
      color: var(--navy);
      line-height: 1.15;
      margin-bottom: 28px;
    }

    h2 em { font-style: italic; color: var(--charcoal); }

    .ornament { display: flex; align-items: center; gap: 12px; margin-bottom: 40px; }
    .orn-line { width: 44px; height: 1px; background: var(--gold); opacity: 0.6; }
    .orn-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--gold); }

    p {
      font-family: 'EB Garamond', serif;
      font-size: 1.18rem;
      line-height: 1.9;
      color: var(--text-mid);
      margin-bottom: 26px;
    }

    p:last-child { margin-bottom: 0; }

    .pull-quote {
      border-left: 3px solid var(--navy);
      margin: 44px 0;
      padding: 22px 32px;
      background: linear-gradient(135deg, var(--cream-mid), var(--cream));
      position: relative;
    }

    .pull-quote::before {
      content: '';
      position: absolute;
      top: 0; left: -3px;
      width: 3px; height: 40%;
      background: var(--gold);
    }

    .pull-quote p {
      font-family: 'Playfair Display', serif;
      font-size: 1.22rem;
      font-style: italic;
      color: var(--navy);
      margin: 0;
      line-height: 1.7;
    }

    /* SECTION DIVIDER */
    .section-divider {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 64px 0 48px;
    }

    .section-divider-line {
      flex: 1;
      height: 1px;
      background: var(--border-navy);
    }

    .section-divider-label {
      font-family: 'Jost', sans-serif;
      font-size: 0.6rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--gold);
      white-space: nowrap;
    }

    /* SERVICES */
    .services-intro { margin-bottom: 44px; }

    .services-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      gap: 2px;
      background: var(--border-navy);
    }

    .service-card {
      background: var(--cream);
      padding: 36px 30px;
      transition: background 0.3s;
      border-top: 2px solid transparent;
    }

    .service-card:hover { background: var(--cream-mid); border-top-color: var(--navy); }

    .service-number {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      font-weight: 400;
      color: var(--navy);
      opacity: 0.12;
      line-height: 1;
      margin-bottom: 16px;
    }

    .service-card h3 {
      font-family: 'Playfair Display', serif;
      font-size: 1.12rem;
      font-weight: 500;
      color: var(--navy);
      margin-bottom: 12px;
    }

    .service-card p { font-size: 1rem; line-height: 1.75; color: var(--text-light); margin-bottom: 0; }

    .service-tag {
      display: inline-block;
      margin-top: 18px;
      font-family: 'Jost', sans-serif;
      font-size: 0.58rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold);
      border-bottom: 1px solid var(--gold-pale);
      padding-bottom: 2px;
    }

    /* CLIENTS */
    .clients-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 2px;
      background: var(--border-navy);
    }

    .client-card {
      background: var(--cream);
      padding: 40px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: background 0.3s;
      min-height: 160px;
    }

    .client-card:hover { background: var(--cream-mid); }

    .client-logo-placeholder {
      width: 100%;
      max-width: 160px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .client-logo-placeholder img {
      max-width: 100%;
      max-height: 80px;
      object-fit: contain;
      filter: grayscale(20%);
      transition: filter 0.3s;
    }

    .client-card:hover .client-logo-placeholder img { filter: grayscale(0%); }

    /* Logo placeholder text for when images aren't loaded */
    .logo-text {
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      font-weight: 500;
      color: var(--navy);
      text-align: center;
      letter-spacing: 0.04em;
    }

    /* PARTNERS */
    .partner-card {
      display: grid;
      grid-template-columns: 200px 1fr;
      gap: 0;
      background: var(--cream);
      border: 1px solid var(--border-navy);
      margin-bottom: 2px;
      transition: background 0.3s;
      overflow: hidden;
    }

    .partner-card:hover { background: var(--cream-mid); }

    .partner-logo-col {
      background: var(--navy);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 36px 28px;
      min-height: 200px;
    }

    .partner-logo-col img {
      max-width: 130px;
      max-height: 100px;
      object-fit: contain;
      filter: brightness(0) invert(1);
      opacity: 0.9;
    }

    .partner-logo-text {
      font-family: 'Playfair Display', serif;
      font-size: 1rem;
      font-weight: 500;
      color: var(--cream);
      text-align: center;
      letter-spacing: 0.05em;
      line-height: 1.4;
    }

    .partner-content-col {
      padding: 36px 40px;
      border-left: 3px solid transparent;
      transition: border-color 0.3s;
      position: relative;
    }

    .partner-card:hover .partner-content-col { border-left-color: var(--gold); }

    .partner-tag {
      font-family: 'Jost', sans-serif;
      font-size: 0.58rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 12px;
      display: block;
    }

    .partner-content-col h3 {
      font-family: 'Playfair Display', serif;
      font-size: 1.3rem;
      font-weight: 400;
      color: var(--navy);
      margin-bottom: 16px;
    }

    .partner-content-col p {
      font-size: 1.05rem;
      line-height: 1.8;
      color: var(--text-mid);
      margin-bottom: 0;
    }

    .partner-link {
      display: inline-block;
      margin-top: 20px;
      font-family: 'Jost', sans-serif;
      font-size: 0.62rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--navy);
      border-bottom: 1px solid var(--gold);
      padding-bottom: 3px;
      text-decoration: none;
      transition: color 0.25s;
    }

    .partner-link:hover { color: var(--gold); }

    /* BLOG */
    .blog-intro { margin-bottom: 44px; }

    .blog-links { display: flex; flex-direction: column; gap: 2px; background: var(--border-navy); }

    .blog-link {
      display: flex;
      align-items: center;
      gap: 28px;
      padding: 32px 36px;
      background: var(--cream);
      text-decoration: none;
      transition: background 0.3s;
      border-left: 3px solid transparent;
    }

    .blog-link:hover { background: var(--cream-mid); border-left-color: var(--navy); }

    .blog-icon {
      width: 50px; height: 50px;
      background: var(--navy);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background 0.3s;
    }

    .blog-link:hover .blog-icon { background: var(--navy-mid); }
    .blog-icon svg { width: 21px; height: 21px; fill: var(--cream); }
    .blog-link-text { flex: 1; }

    .blog-link-text h3 {
      font-family: 'Playfair Display', serif;
      font-size: 1.18rem;
      font-weight: 400;
      color: var(--navy);
      margin-bottom: 5px;
    }

    .blog-link-text p {
      font-family: 'Jost', sans-serif;
      font-size: 0.76rem;
      font-weight: 300;
      letter-spacing: 0.06em;
      color: var(--text-light);
      margin: 0;
      line-height: 1.5;
    }

    .blog-arrow { color: var(--gold); font-size: 1.4rem; font-family: 'Playfair Display', serif; transition: transform 0.25s; }
    .blog-link:hover .blog-arrow { transform: translateX(5px); }

    /* CONTACT */
    .contact-wrap { max-width: 580px; }

    .contact-email-block {
      margin-top: 48px;
      background: var(--navy);
      padding: 44px 48px;
      position: relative;
      overflow: hidden;
    }

    .contact-email-block::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--navy-deep), var(--gold), var(--navy-deep));
    }

    .contact-email-block::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image: repeating-linear-gradient(135deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 48px);
      pointer-events: none;
    }

    .contact-email-label {
      font-family: 'Jost', sans-serif;
      font-size: 0.58rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--gold-light);
      margin-bottom: 16px;
      display: block;
      position: relative;
      z-index: 1;
    }

    .contact-email {
      font-family: 'Playfair Display', serif;
      font-size: 1.22rem;
      font-style: italic;
      color: var(--cream);
      line-height: 1.5;
      position: relative;
      z-index: 1;
    }

    /* FOOTER */
    footer {
      position: relative;
      z-index: 5;
      background: var(--navy-deep);
      padding: 28px 40px;
      text-align: center;
    }

    .footer-ornament { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 16px; }
    .fo-line { width: 44px; height: 1px; background: var(--gold); opacity: 0.3; }
    .fo-diamond { width: 4px; height: 4px; background: var(--gold); transform: rotate(45deg); opacity: 0.5; }

    .footer-text {
      font-family: 'Jost', sans-serif;
      font-size: 0.62rem;
      font-weight: 300;
      letter-spacing: 0.16em;
      color: rgba(244,240,232,0.3);
      line-height: 1.8;
    }

    @media (max-width: 680px) {
      header { padding: 40px 20px 0; }
      nav button { padding: 14px 12px; font-size: 0.56rem; letter-spacing: 0.1em; }
      main { padding: 72px 20px 80px; }
      .blog-link { padding: 24px 20px; gap: 16px; }
      .contact-email-block { padding: 32px 28px; }
      .services-grid { grid-template-columns: 1fr; }
      .partner-card { grid-template-columns: 1fr; }
      .partner-logo-col { min-height: 120px; }
      .partner-content-col { padding: 28px 24px; }
      .lang-bar { padding: 8px 16px; }
    }
  </style>
</head>
<body>

<div class="top-bar"></div>

<div class="lang-bar">
  <span class="lang-label">Language</span>
  <button class="lang-btn active" onclick="setLang('en', this)">EN</button>
  <button class="lang-btn" onclick="setLang('pt', this)">PT</button>
  <button class="lang-btn" onclick="setLang('zh', this)">中文</button>
  <button class="lang-btn" onclick="setLang('it', this)">IT</button>
</div>

<header>
  <div class="logo-wrap">
    <img src="logo.jpg" alt="McFetridge and Co.">
  </div>
  <div class="header-rule">
    <div class="rule-line"></div>
    <div class="rule-diamond"></div>
    <div class="rule-line right"></div>
  </div>
  <nav id="main-nav">
    <button class="active" onclick="showTab('about', this)" data-tab="about"></button>
    <button onclick="showTab('services', this)" data-tab="services"></button>
    <button onclick="showTab('partners', this)" data-tab="partners"></button>
    <button onclick="showTab('blog', this)" data-tab="blog"></button>
    <button onclick="showTab('contact', this)" data-tab="contact"></button>
  </nav>
</header>

<main>

  <!-- ABOUT -->
  <div id="about" class="tab-panel active">
    <span class="eyebrow" data-key="about_eyebrow"></span>
    <h2 data-key="about_h2"></h2>
    <div class="ornament"><div class="orn-line"></div><div class="orn-dot"></div></div>
    <p data-key="about_p1"></p>
    <div class="pull-quote"><p data-key="about_quote"></p></div>
    <p data-key="about_p2"></p>
    <p data-key="about_p3"></p>
  </div>

  <!-- SERVICES -->
  <div id="services" class="tab-panel">
    <span class="eyebrow" data-key="services_eyebrow"></span>
    <h2 data-key="services_h2"></h2>
    <div class="ornament"><div class="orn-line"></div><div class="orn-dot"></div></div>
    <div class="services-intro"><p data-key="services_intro"></p></div>
    <div class="services-grid">
      <div class="service-card"><div class="service-number">01</div><h3 data-key="s1_title"></h3><p data-key="s1_desc"></p><span class="service-tag" data-key="s1_tag"></span></div>
      <div class="service-card"><div class="service-number">02</div><h3 data-key="s2_title"></h3><p data-key="s2_desc"></p><span class="service-tag" data-key="s2_tag"></span></div>
      <div class="service-card"><div class="service-number">03</div><h3 data-key="s3_title"></h3><p data-key="s3_desc"></p><span class="service-tag" data-key="s3_tag"></span></div>
      <div class="service-card"><div class="service-number">04</div><h3 data-key="s4_title"></h3><p data-key="s4_desc"></p><span class="service-tag" data-key="s4_tag"></span></div>
      <div class="service-card"><div class="service-number">05</div><h3 data-key="s5_title"></h3><p data-key="s5_desc"></p><span class="service-tag" data-key="s5_tag"></span></div>
      <div class="service-card"><div class="service-number">06</div><h3 data-key="s6_title"></h3><p data-key="s6_desc"></p><span class="service-tag" data-key="s6_tag"></span></div>
    </div>

    <!-- CLIENTS -->
    <div class="section-divider">
      <div class="section-divider-line"></div>
      <span class="section-divider-label" data-key="clients_label"></span>
      <div class="section-divider-line"></div>
    </div>
    <div class="services-intro"><p data-key="clients_intro"></p></div>
    <div class="clients-grid">
      <div class="client-card">
        <div class="client-logo-placeholder">
          <!-- Replace src with kris-logo.png once uploaded -->
          <img src="kris-logo.png" alt="KRIS" onerror="this.style.display='none'; this.nextElementSibling.style.display='block'">
          <span class="logo-text" style="display:none;">KRIS</span>
        </div>
      </div>
      <div class="client-card">
        <div class="client-logo-placeholder">
          <!-- Replace src with franz-haas-logo.png once uploaded -->
          <img src="franz-haas-logo.png" alt="Franz Haas" onerror="this.style.display='none'; this.nextElementSibling.style.display='block'">
          <span class="logo-text" style="display:none;">Franz Haas</span>
        </div>
      </div>
    </div>
  </div>

  <!-- PARTNERS -->
  <div id="partners" class="tab-panel">
    <span class="eyebrow" data-key="partners_eyebrow"></span>
    <h2 data-key="partners_h2"></h2>
    <div class="ornament"><div class="orn-line"></div><div class="orn-dot"></div></div>
    <p data-key="partners_intro"></p>

    <!-- FLX International -->
    <div class="partner-card" style="margin-top: 44px;">
      <div class="partner-logo-col">
        <img src="flx-logo.png" alt="FLX International" onerror="this.style.display='none'; this.nextElementSibling.style.display='block'">
        <span class="partner-logo-text" style="display:none;">FLX<br>International</span>
      </div>
      <div class="partner-content-col">
        <span class="partner-tag" data-key="flx_tag"></span>
        <h3>FLX International</h3>
        <p data-key="flx_bio"></p>
        <a href="https://flxinternational.com" target="_blank" class="partner-link" data-key="partner_visit"></a>
      </div>
    </div>

    <!-- Sip Happens -->
    <div class="partner-card">
      <div class="partner-logo-col">
        <img src="sip-happens-logo.png" alt="Sip Happens" onerror="this.style.display='none'; this.nextElementSibling.style.display='block'">
        <span class="partner-logo-text" style="display:none;">Sip Happens</span>

  const navKeys = ['nav_about', 'nav_services', 'nav_partners', 'nav_blog', 'nav_contact'];
  let currentLang = 'en';

  function setLang(lang, btn) {
    currentLang = lang;
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.documentElement.lang = lang;
    applyTranslations();
  }

  function applyTranslations() {
    const t = translations[currentLang];
    const navBtns = document.querySelectorAll('#main-nav button');
    navBtns.forEach((btn, i) => { btn.textContent = t[navKeys[i]]; });
    document.querySelectorAll('[data-key]').forEach(el => {
      const key = el.getAttribute('data-key');
      if (t[key] !== undefined) el.textContent = t[key];
    });
  }

  function showTab(id, btn) {
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('#main-nav button').forEach(b => b.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    btn.classList.add('active');
  }

  applyTranslations();
</script>
